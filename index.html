<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 로또 번호 생성기</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:linear-gradient(135deg,#0f172a,#1e293b);
    color:white;
    min-height:100vh;
    padding:30px;
}

.container{
    max-width:1200px;
    margin:auto;
}

h1{
    text-align:center;
    margin-bottom:10px;
    font-size:42px;
}

.sub{
    text-align:center;
    color:#cbd5e1;
    margin-bottom:30px;
}

.btn-wrap{
    display:flex;
    justify-content:center;
    gap:15px;
    flex-wrap:wrap;
    margin-bottom:30px;
}

button{
    background:#ff4d6d;
    color:white;
    border:none;
    padding:15px 30px;
    border-radius:15px;
    font-size:18px;
    cursor:pointer;
    font-weight:bold;
    transition:transform 0.15s, box-shadow 0.15s, background 0.2s, opacity 0.2s;
}

button:hover:not(:disabled){
    transform:translateY(-2px);
    box-shadow:0 6px 20px rgba(255,77,109,0.5);
}

button:active:not(:disabled){
    transform:scale(0.93);
    box-shadow:none;
}

button:disabled{
    background:#475569;
    cursor:not-allowed;
    opacity:0.7;
}

.btn-ai{
    background:linear-gradient(135deg,#7c3aed,#a855f7);
    box-shadow:0 4px 15px rgba(124,58,237,0.4);
}

.btn-ai:hover:not(:disabled){
    box-shadow:0 6px 20px rgba(168,85,247,0.6);
    transform:translateY(-2px);
}

@keyframes spin{
    to{transform:rotate(360deg);}
}

.spinner{
    display:inline-block;
    width:16px;
    height:16px;
    border:2px solid rgba(255,255,255,0.4);
    border-top-color:white;
    border-radius:50%;
    animation:spin 0.7s linear infinite;
    vertical-align:middle;
    margin-right:8px;
}

@keyframes btnShake{
    0%,100%{transform:translateX(0);}
    20%{transform:translateX(-5px);}
    40%{transform:translateX(5px);}
    60%{transform:translateX(-4px);}
    80%{transform:translateX(4px);}
}

button.shaking{
    animation:btnShake 0.4s ease;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(500px,1fr));
    gap:20px;
}

.card{
    background:rgba(255,255,255,0.08);
    border-radius:20px;
    padding:25px;
    backdrop-filter:blur(10px);
    opacity:0;
    transform:translateY(30px);
}

.card.visible{
    animation:cardIn 0.45s ease forwards;
}

@keyframes cardIn{
    to{opacity:1;transform:translateY(0);}
}

.card h3{
    margin-bottom:20px;
}

.ai-section{
    margin-bottom:20px;
}

.card-ai{
    background:linear-gradient(135deg,rgba(124,58,237,0.25),rgba(168,85,247,0.15));
    border:1px solid rgba(168,85,247,0.5);
    border-radius:20px;
    padding:25px;
    backdrop-filter:blur(10px);
    opacity:0;
    transform:translateY(30px);
}

.card-ai.visible{
    animation:cardIn 0.5s ease forwards;
}

.card-ai h3{
    margin-bottom:20px;
    color:#c4b5fd;
}

.ai-error{
    color:#f87171;
    padding:15px 0;
    font-size:15px;
}

.numbers{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    align-items:center;
}

.ball{
    width:55px;
    height:55px;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    font-weight:bold;
    font-size:20px;
    color:white;
    opacity:0;
    transform:scale(0.3);
}

.ball.pop{
    animation:ballPop 0.4s cubic-bezier(0.34,1.56,0.64,1) forwards;
}

@keyframes ballPop{
    to{opacity:1;transform:scale(1);}
}

.bonus-label{
    font-size:22px;
    font-weight:bold;
    margin:0 10px;
}

.yellow{background:#fbc400;}
.blue{background:#4da6ff;}
.red{background:#ff5b5b;}
.gray{background:#7c7c7c;}
.green{background:#3cb371;}

.info{
    margin-top:30px;
    padding:20px;
    background:rgba(255,255,255,0.05);
    border-radius:15px;
    color:#cbd5e1;
    line-height:1.7;
}

/* 모달 */
.modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.7);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:100;
    backdrop-filter:blur(4px);
}

.modal{
    background:#1e293b;
    border:1px solid rgba(168,85,247,0.4);
    border-radius:20px;
    padding:32px;
    width:90%;
    max-width:480px;
}

.modal h2{
    margin-bottom:10px;
    font-size:20px;
    color:#c4b5fd;
}

.modal p{
    color:#94a3b8;
    font-size:14px;
    margin-bottom:20px;
    line-height:1.6;
}

.modal input{
    width:100%;
    padding:12px 16px;
    border-radius:10px;
    border:1px solid rgba(168,85,247,0.4);
    background:rgba(255,255,255,0.06);
    color:white;
    font-size:14px;
    margin-bottom:16px;
    outline:none;
}

.modal input:focus{
    border-color:#a855f7;
}

.modal-btns{
    display:flex;
    gap:10px;
    justify-content:flex-end;
}

.modal-btns button{
    padding:10px 22px;
    font-size:15px;
}

.btn-cancel{
    background:rgba(255,255,255,0.1) !important;
}

.btn-cancel:hover:not(:disabled){
    background:rgba(255,255,255,0.18) !important;
    box-shadow:none !important;
}
</style>
</head>
<body>

<div class="container">

<h1>🎰 AI 로또 번호 생성기</h1>

<p class="sub">
과거 당첨 빈도가 높았던 번호에 가중치를 적용하여 추천번호를 생성합니다.
</p>

<div class="btn-wrap">
    <button id="genBtn" onclick="generateSets()">
        번호 5세트 생성하기
    </button>
    <button id="aiBtn" class="btn-ai" onclick="generateAI()">
        ✨ AI 추천 받기
    </button>
</div>

<div id="ai-result" class="ai-section"></div>
<div id="result" class="grid"></div>

<div class="info">
<b>안내</b><br>
로또는 모든 번호의 실제 당첨 확률이 동일합니다.<br>
본 추천은 과거 출현 빈도를 가정한 가중치 기반 추천일 뿐 미래 당첨을 보장하지 않습니다.
</div>

</div>

<!-- API 키 입력 모달 -->
<div id="keyModal" class="modal-overlay" style="display:none;">
    <div class="modal">
        <h2>🔑 OpenRouter API 키 입력</h2>
        <p>
            AI 추천 기능은 OpenRouter API 키가 필요합니다.<br>
            키는 이 브라우저에만 저장되며 외부로 전송되지 않습니다.<br>
            <a href="https://openrouter.ai/keys" target="_blank" style="color:#a855f7;">openrouter.ai/keys</a>에서 발급받을 수 있습니다.
        </p>
        <input id="keyInput" type="password" placeholder="sk-or-v1-..." />
        <div class="modal-btns">
            <button class="btn-cancel" onclick="closeModal()">취소</button>
            <button class="btn-ai" onclick="saveKey()">저장 후 추천 받기</button>
        </div>
    </div>
</div>

<script>

const hotNumbers = [
  7,12,13,17,18,21,22,25,
  27,31,32,35,37,41,43,45
];

const weightedPool = [];

for(let i=1;i<=45;i++){
    let weight = 1;
    if(hotNumbers.includes(i)) weight = 5;
    for(let j=0;j<weight;j++) weightedPool.push(i);
}

function getWeightedNumber(excluded){
    let num;
    do{
        num = weightedPool[Math.floor(Math.random()*weightedPool.length)];
    }while(excluded.includes(num));
    return num;
}

function generateLotto(){
    const numbers=[];
    while(numbers.length<6) numbers.push(getWeightedNumber(numbers));
    numbers.sort((a,b)=>a-b);
    let bonus;
    do{ bonus = getWeightedNumber(numbers); }while(numbers.includes(bonus));
    return { main:numbers, bonus:bonus };
}

function getColor(num){
    if(num<=10) return "yellow";
    if(num<=20) return "blue";
    if(num<=30) return "red";
    if(num<=40) return "gray";
    return "green";
}

function generateSets(){
    const btn=document.getElementById("genBtn");
    btn.disabled=true;
    btn.innerHTML='<span class="spinner"></span>번호 생성 중...';
    btn.classList.remove("shaking");
    void btn.offsetWidth;
    btn.classList.add("shaking");

    const result=document.getElementById("result");
    result.innerHTML="";

    const SETS=5, BALLS=7;
    const totalDuration=SETS*80+(BALLS-1)*60+400;

    for(let i=1;i<=SETS;i++){
        const lotto=generateLotto();
        const card=document.createElement("div");
        card.className="card";
        card.innerHTML=`
            <h3>🎟 추천 ${i}세트</h3>
            <div class="numbers">
                ${lotto.main.map((n,idx)=>`<div class="ball ${getColor(n)}" data-idx="${idx}">${n}</div>`).join("")}
                <span class="bonus-label">+</span>
                <div class="ball ${getColor(lotto.bonus)}" data-idx="${lotto.main.length}">${lotto.bonus}</div>
            </div>
        `;
        result.appendChild(card);

        setTimeout(()=>{
            card.classList.add("visible");
            card.querySelectorAll(".ball").forEach((ball,idx)=>{
                setTimeout(()=>ball.classList.add("pop"),idx*60);
            });
        }, i*80);
    }

    setTimeout(()=>{
        btn.disabled=false;
        btn.innerHTML='번호 5세트 생성하기';
    }, totalDuration);
}

// AI 추천

function openModal(){ document.getElementById('keyModal').style.display='flex'; document.getElementById('keyInput').focus(); }
function closeModal(){ document.getElementById('keyModal').style.display='none'; }

function saveKey(){
    const key = document.getElementById('keyInput').value.trim();
    if(!key){ alert('API 키를 입력해주세요.'); return; }
    localStorage.setItem('or_key', key);
    closeModal();
    callAI(key);
}

function generateAI(){
    const key = localStorage.getItem('or_key');
    if(!key){ openModal(); return; }
    callAI(key);
}

async function callAI(key){
    const btn = document.getElementById('aiBtn');
    const genBtn = document.getElementById('genBtn');
    const aiResult = document.getElementById('ai-result');

    btn.disabled = true;
    genBtn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>AI 분석 중...';
    aiResult.innerHTML = '';

    try {
        const res = await fetch('https://openrouter.ai/api/v1/chat/completions', {
            method: 'POST',
            headers: {
                'Authorization': `Bearer ${key}`,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                model: 'openai/gpt-4o-mini',
                messages: [{
                    role: 'user',
                    content: '한국 로또 번호 6개와 보너스 번호 1개를 추천해줘. 1~45 사이 정수, 7개 모두 서로 다른 숫자여야 해. 반드시 아래 JSON 형식으로만 응답해. 다른 텍스트는 쓰지 마:\n{"main":[n1,n2,n3,n4,n5,n6],"bonus":n7}'
                }],
                max_tokens: 60
            })
        });

        if(res.status === 401){
            localStorage.removeItem('or_key');
            throw new Error('API 키가 유효하지 않습니다. 다시 입력해주세요.');
        }

        const data = await res.json();
        const raw = data.choices?.[0]?.message?.content?.trim() ?? '';
        const match = raw.match(/\{[\s\S]*\}/);
        if(!match) throw new Error('응답 형식 오류');

        const parsed = JSON.parse(match[0]);
        const main = parsed.main;
        const bonus = parsed.bonus;

        if(
            !Array.isArray(main) || main.length !== 6 ||
            typeof bonus !== 'number' ||
            [...main, bonus].some(n => n < 1 || n > 45) ||
            new Set([...main, bonus]).size !== 7
        ) throw new Error('번호 유효성 오류');

        main.sort((a, b) => a - b);

        const card = document.createElement('div');
        card.className = 'card-ai';
        card.innerHTML = `
            <h3>✨ AI 추천 번호</h3>
            <div class="numbers">
                ${main.map((n,idx)=>`<div class="ball ${getColor(n)}" data-idx="${idx}">${n}</div>`).join('')}
                <span class="bonus-label">+</span>
                <div class="ball ${getColor(bonus)}" data-idx="6">${bonus}</div>
            </div>
        `;
        aiResult.appendChild(card);

        setTimeout(()=>{
            card.classList.add('visible');
            card.querySelectorAll('.ball').forEach((ball,idx)=>{
                setTimeout(()=>ball.classList.add('pop'), idx*70);
            });
        }, 50);

    } catch(e) {
        aiResult.innerHTML = `<div class="card-ai visible" style="opacity:1;transform:none;">
            <div class="ai-error">⚠️ ${e.message}</div>
        </div>`;
    } finally {
        btn.disabled = false;
        genBtn.disabled = false;
        btn.innerHTML = '✨ AI 추천 받기';
    }
}

// ESC로 모달 닫기
document.addEventListener('keydown', e => { if(e.key==='Escape') closeModal(); });

generateSets();

</script>

</body>
</html>
