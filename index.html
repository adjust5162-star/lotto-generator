<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 로또 번호 생성기</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:linear-gradient(135deg,#0f172a,#1e293b);
    color:white;
    min-height:100vh;
    padding:30px;
}

.container{
    max-width:1200px;
    margin:auto;
}

h1{
    text-align:center;
    margin-bottom:10px;
    font-size:42px;
}

.sub{
    text-align:center;
    color:#cbd5e1;
    margin-bottom:30px;
}

.btn-wrap{
    text-align:center;
    margin-bottom:30px;
}

button{
    background:#ff4d6d;
    color:white;
    border:none;
    padding:15px 30px;
    border-radius:15px;
    font-size:18px;
    cursor:pointer;
    font-weight:bold;
    transition:transform 0.15s, box-shadow 0.15s, background 0.2s, opacity 0.2s;
}

button:hover:not(:disabled){
    transform:translateY(-2px);
    box-shadow:0 6px 20px rgba(255,77,109,0.5);
}

button:active:not(:disabled){
    transform:scale(0.93);
    box-shadow:none;
}

button:disabled{
    background:#475569;
    cursor:not-allowed;
    opacity:0.7;
}

@keyframes spin{
    to{transform:rotate(360deg);}
}

.spinner{
    display:inline-block;
    width:16px;
    height:16px;
    border:2px solid rgba(255,255,255,0.4);
    border-top-color:white;
    border-radius:50%;
    animation:spin 0.7s linear infinite;
    vertical-align:middle;
    margin-right:8px;
}

@keyframes btnShake{
    0%,100%{transform:translateX(0);}
    20%{transform:translateX(-5px);}
    40%{transform:translateX(5px);}
    60%{transform:translateX(-4px);}
    80%{transform:translateX(4px);}
}

button.shaking{
    animation:btnShake 0.4s ease;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(500px,1fr));
    gap:20px;
}

.card{
    background:rgba(255,255,255,0.08);
    border-radius:20px;
    padding:25px;
    backdrop-filter:blur(10px);
    opacity:0;
    transform:translateY(30px);
}

.card.visible{
    animation:cardIn 0.45s ease forwards;
}

@keyframes cardIn{
    to{opacity:1;transform:translateY(0);}
}

.card h3{
    margin-bottom:20px;
}

.numbers{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    align-items:center;
}

.ball{
    width:55px;
    height:55px;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    font-weight:bold;
    font-size:20px;
    color:white;
    opacity:0;
    transform:scale(0.3);
}

.ball.pop{
    animation:ballPop 0.4s cubic-bezier(0.34,1.56,0.64,1) forwards;
}

@keyframes ballPop{
    to{opacity:1;transform:scale(1);}
}

.bonus-label{
    font-size:22px;
    font-weight:bold;
    margin:0 10px;
}

.yellow{background:#fbc400;}
.blue{background:#4da6ff;}
.red{background:#ff5b5b;}
.gray{background:#7c7c7c;}
.green{background:#3cb371;}

.info{
    margin-top:30px;
    padding:20px;
    background:rgba(255,255,255,0.05);
    border-radius:15px;
    color:#cbd5e1;
    line-height:1.7;
}
</style>
</head>
<body>

<div class="container">

<h1>🎰 AI 로또 번호 생성기</h1>

<p class="sub">
과거 당첨 빈도가 높았던 번호에 가중치를 적용하여 추천번호를 생성합니다.
</p>

<div class="btn-wrap">
    <button id="genBtn" onclick="generateSets()">
        번호 5세트 생성하기
    </button>
</div>

<div id="result" class="grid"></div>

<div class="info">
<b>안내</b><br>
로또는 모든 번호의 실제 당첨 확률이 동일합니다.<br>
본 추천은 과거 출현 빈도를 가정한 가중치 기반 추천일 뿐 미래 당첨을 보장하지 않습니다.
</div>

</div>

<script>

// 자주 나왔다고 가정한 번호
const hotNumbers = [
  7,12,13,17,18,21,22,25,
  27,31,32,35,37,41,43,45
];

// 가중치 풀 생성
const weightedPool = [];

for(let i=1;i<=45;i++){

    let weight = 1;

    if(hotNumbers.includes(i)){
        weight = 5;
    }

    for(let j=0;j<weight;j++){
        weightedPool.push(i);
    }
}

function getWeightedNumber(excluded){

    let num;

    do{
        num = weightedPool[
            Math.floor(Math.random()*weightedPool.length)
        ];
    }while(excluded.includes(num));

    return num;
}

function generateLotto(){

    const numbers=[];

    while(numbers.length<6){
        numbers.push(
            getWeightedNumber(numbers)
        );
    }

    numbers.sort((a,b)=>a-b);

    let bonus;

    do{
        bonus = getWeightedNumber(numbers);
    }while(numbers.includes(bonus));

    return {
        main:numbers,
        bonus:bonus
    };
}

function getColor(num){

    if(num<=10) return "yellow";
    if(num<=20) return "blue";
    if(num<=30) return "red";
    if(num<=40) return "gray";

    return "green";
}

function createBall(num){

    return `
        <div class="ball ${getColor(num)}">
            ${num}
        </div>
    `;
}

function generateSets(){

    const btn=document.getElementById("genBtn");

    // 비활성화 + 스피너
    btn.disabled=true;
    btn.innerHTML='<span class="spinner"></span>번호 생성 중...';

    // 버튼 흔들기
    btn.classList.remove("shaking");
    void btn.offsetWidth;
    btn.classList.add("shaking");

    const result=document.getElementById("result");
    result.innerHTML="";

    const SETS=5;
    const BALLS=7; // 메인 6 + 보너스 1
    // 마지막 볼이 pop 완료되는 시점: 마지막 카드 딜레이 + 마지막 볼 딜레이 + pop 애니메이션
    const totalDuration=SETS*80 + (BALLS-1)*60 + 400;

    for(let i=1;i<=SETS;i++){

        const lotto=generateLotto();
        const card=document.createElement("div");
        card.className="card";

        const bonusIdx=lotto.main.length;

        card.innerHTML=`
            <h3>🎟 추천 ${i}세트</h3>
            <div class="numbers">
                ${lotto.main.map((n,idx)=>`
                    <div class="ball ${getColor(n)}" data-idx="${idx}">${n}</div>
                `).join("")}
                <span class="bonus-label">+</span>
                <div class="ball ${getColor(lotto.bonus)}" data-idx="${bonusIdx}">${lotto.bonus}</div>
            </div>
        `;

        result.appendChild(card);

        const cardDelay=i*80;
        setTimeout(()=>{
            card.classList.add("visible");

            card.querySelectorAll(".ball").forEach((ball,idx)=>{
                setTimeout(()=>{
                    ball.classList.add("pop");
                },idx*60);
            });
        }, cardDelay);
    }

    // 모든 애니메이션 완료 후 버튼 복원
    setTimeout(()=>{
        btn.disabled=false;
        btn.innerHTML='번호 5세트 생성하기';
    }, totalDuration);
}

// 첫 화면 자동 생성
generateSets();

</script>

</body>
</html>
